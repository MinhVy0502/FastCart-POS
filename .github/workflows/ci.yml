name: FastCart POS - CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Syntax & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Verify Backend Syntax & Dependencies
        run: |
          cd backend
          npm ci
          node -c src/server.js
          node -c src/app.js

      - name: Verify Frontend Production Build
        run: |
          cd frontend
          npm ci
          npm run build
